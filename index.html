    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; margin: 0; overflow: hidden; }

        /* Header */
        .site-header { height: 56px; background: #000; border-bottom: 1px solid rgba(0,255,136,0.2); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: sticky; top: 0; z-index: 10; }

        /* Search */
        .search-wrap { padding: 10px 14px 6px; }
        .search-input { width: 100%; background: #111; border: 1px solid #2a2a2a; border-radius: 12px; padding: 10px 14px; color: white; outline: none; font-family: 'Tajawal', sans-serif; font-size: 14px; transition: 0.3s; }
        .search-input:focus { border-color: #00ff88; box-shadow: 0 0 8px rgba(0,255,136,0.15); }

        /* Category tabs */
        .cat-scroll { display: flex; gap: 8px; padding: 6px 14px 10px; overflow-x: auto; scrollbar-width: none; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { flex-shrink: 0; padding: 5px 14px; border-radius: 20px; border: 1px solid #333; background: #111; color: #888; font-size: 12px; font-family: 'Tajawal', sans-serif; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .cat-btn:active { transform: scale(0.95); }
        .cat-btn.active { background: #00ff88; border-color: #00ff88; color: #000; }

        /* Grid */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 4px 10px 80px; overflow-y: auto; }
        .game-grid-wrap { height: calc(100vh - 210px); overflow-y: auto; }

        /* Card */
        .game-card { background: #111; border-radius: 12px; overflow: hidden; border: 1px solid #1e1e1e; cursor: pointer; transition: transform 0.15s, border-color 0.15s; display: flex; flex-direction: column; }
        .game-card:active { transform: scale(0.93); border-color: #00ff88; }
        .game-thumbnail { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #1a1a1a; display: block; }
        .game-info { padding: 5px 4px 7px; text-align: center; font-weight: 700; font-size: 10px; color: #00ff88; line-height: 1.3; min-height: 32px; display: flex; align-items: center; justify-content: center; }

        /* Category badge on card */
        .cat-badge { font-size: 9px; color: #555; margin-top: 1px; }

        /* Skeleton */
        .skeleton { background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 12px; aspect-ratio: 1; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .fav-btn { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.6); border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 5; transition: 0.2s; }
        .fav-btn.active { background: rgba(255,50,50,0.8); }
        .device-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); border-radius: 8px; padding: 2px 5px; font-size: 9px; color: #aaa; z-index: 5; }
        .device-badge.desktop { color: #60a5fa; }
        .device-tabs { display: flex; gap: 6px; padding: 0 14px 8px; }
        .device-btn { flex-shrink: 0; padding: 4px 12px; border-radius: 20px; border: 1px solid #333; background: #111; color: #666; font-size: 11px; font-family: "Tajawal", sans-serif; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .device-btn.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
        .game-card { position: relative; }
        .recently-section { padding: 8px 14px 4px; }
        .recently-title { font-size: 12px; color: #555; margin-bottom: 6px; font-weight: 700; }
        .recently-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
        .recently-scroll::-webkit-scrollbar { display: none; }
        .recently-item { flex-shrink: 0; width: 50px; text-align: center; cursor: pointer; }
        .recently-item img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; border: 1px solid #222; }
        .recently-item span { font-size: 8px; color: #555; display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Empty state */
        .empty-state { grid-column: 1/-1; text-align: center; padding: 40px 20px; color: #444; }

        /* Game overlay */
        #gameOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; }
        .game-header { height: 52px; background: #111; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #222; }

        .game-btn { font-size: 10px; padding: 5px 10px; border-radius: 20px; font-family: 'Tajawal', sans-serif; font-weight: 700; cursor: pointer; border: 1px solid; }

    <!-- Game Overlay -->
    <div id="gameOverlay">
        <div class="game-header">
            <button onclick="closeGame()" style="color:white; font-size:20px; font-weight:bold; background:none; border:none; cursor:pointer;">✕</button>
            <span id="currentGameTitle" style="color:#00ff88; font-weight:bold; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;"></span>

                <button class="game-btn" onclick="toggleFullScreen()" style="color:#00ff88; border-color:#00ff88; background:rgba(0,255,136,0.1);">⛶ ملء</button>

    <script>
        let games = [];
        let activeCategory = 'الكل';
        let currentGameId = null;
        let activeDevice = 'all';
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        let recentlyPlayed = JSON.parse(localStorage.getItem('recentlyPlayed') || '[]');

        // تعريف أيقونات التصنيفات
        const catIcons = {
            'رياضة':'⚽',
            'أكشن': '⚔️',
            'سباق': '🏎️',
            'ألغاز': '🧩',
            'مغامرة': '🗺️',
            'استراتيجية': '♟️',
            'محاكاة': '🏗️',
            'رعب': '👻',
            'الكل': '🎮'
        };

        async function loadGames() {
            try {
                const res = await fetch('games.json');
                if (!res.ok) throw new Error('فشل الجلب');
                games = await res.json();
                buildCategoryTabs();
                renderGames(games);
                document.getElementById('gameCount').textContent = `${games.length} لعبة`;
            } catch (err) {
                document.getElementById('gameGrid').innerHTML =
                    '<div class="empty-state">⚠️ فشل تحميل الألعاب<br><small>تأكد من وجود games.json</small></div>';
            }
        }

        function buildCategoryTabs() {
            const categories = ['الكل', ...new Set(games.map(g => g.category).filter(Boolean))];
            const tabsEl = document.getElementById('catTabs');
            tabsEl.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn' + (cat === 'الكل' ? ' active' : '');
                const icon = catIcons[cat] || '🎯';
                const count = cat === 'الكل' ? games.length : games.filter(g => g.category === cat).length;
                btn.textContent = `${icon} ${cat} (${count})`;
                btn.addEventListener('click', () => filterByCategory(cat));
                tabsEl.appendChild(btn);
                // زر المفضلة بعد الكل مباشرة
                if (cat === 'الكل') {
                    const favBtn = document.createElement('button');
                    favBtn.className = 'cat-btn';
                    favBtn.id = 'favCatBtn';
                    favBtn.textContent = `❤️ المفضلة (${favorites.length})`;
                    favBtn.addEventListener('click', () => filterByFavorites(favBtn));
                    tabsEl.appendChild(favBtn);
                }
            });
        }

        function filterByCategory(cat) {
            activeCategory = cat;
            // تحديث الأزرار
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            // مسح البحث
            document.getElementById('searchInput').value = '';
            // فلترة
            const filtered = cat === 'الكل' ? games : games.filter(g => g.category === cat);
            renderGames(filtered);
        }

        function onSearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            // إعادة تعيين التصنيف للكل عند البحث
            if (term) {
                activeCategory = 'الكل';
                document.querySelectorAll('.cat-btn').forEach((btn, i) => {
                    btn.classList.toggle('active', i === 0);
                });
            }
            applyFilters();
        }

        function renderGames(data) {
            const grid = document.getElementById('gameGrid');
            if (!data.length) {
                grid.innerHTML = '<div class="empty-state">😕 لا توجد ألعاب في هذا التصنيف</div>';
                return;
            }
            grid.innerHTML = '';
            data.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';

                const img = document.createElement('img');
                img.src = game.icon;
                img.className = 'game-thumbnail';
                img.alt = game.name;
                img.loading = 'lazy';

                const info = document.createElement('div');
                info.className = 'game-info';

                const nameEl = document.createElement('div');
                nameEl.textContent = game.name;

                info.appendChild(nameEl);

                // badge التصنيف
                if (game.category && activeCategory === 'الكل') {
                    const badge = document.createElement('div');
                    badge.className = 'cat-badge';
                    badge.textContent = `${catIcons[game.category] || ''} ${game.category}`;
                    info.appendChild(badge);
                }

                card.appendChild(img);
                card.appendChild(info);
                // زر المفضلة
                const favBtn = document.createElement('button');
                favBtn.className = 'fav-btn' + (favorites.includes(game.id) ? ' active' : '');
                favBtn.textContent = favorites.includes(game.id) ? '❤️' : '🤍';
                favBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(game.id, favBtn);
                });
                card.appendChild(favBtn);

                // بادج الجهاز
                if (game.device === 'desktop') {
                    const badge = document.createElement('div');
                    badge.className = 'device-badge desktop';
                    badge.textContent = '🖥️ PC';
                    card.appendChild(badge);
                }

                card.addEventListener('click', () => playGame(game.embedUrl, game.name, game.id));
                grid.appendChild(card);
            });
        }

        function playGame(url, title, id) {
            currentGameId = id;
            document.getElementById('currentGameTitle').textContent = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameOverlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
            // تحديث الـ URL بدون reload
            history.pushState({gameId: id}, title, `?game=${id}`);
            const gameObj = games.find(g => g.id === id);
            if (gameObj) addToRecently(gameObj);
        }

        function closeGame() {
            document.getElementById('gameOverlay').style.display = 'none';
            document.getElementById('gameFrame').src = '';
            document.body.style.overflow = 'auto';
            currentGameId = null;
            if (screen.orientation?.unlock) screen.orientation.unlock();
            history.pushState({}, '', window.location.pathname);
        }

        function toggleFullScreen() {
            const el = document.getElementById('gameFrame');
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }

        async function rotateScreen() {
            try {
                const overlay = document.getElementById('gameOverlay');
                if (!document.fullscreenElement) {
                    if (overlay.requestFullscreen) await overlay.requestFullscreen();
                    else if (overlay.webkitRequestFullscreen) await overlay.webkitRequestFullscreen();
                }
                if (screen.orientation?.lock) await screen.orientation.lock('landscape');
                else alert('يرجى تدوير الشاشة يدوياً');
            } catch (e) { console.log(e); }
        }

        // مشاركة اللعبة
        async function shareGame() {
            const shareUrl = `${location.origin}${location.pathname}?game=${currentGameId}`;
            const title = document.getElementById('currentGameTitle').textContent;
            const shareText = `🎮 Abdo Gaming
العب الآن: ${title}
🔗 ${shareUrl}`;

            if (navigator.share) {
                try {
                    await navigator.share({ title: `${title} - Abdo Gaming`, text: shareText, url: shareUrl });
                } catch(e) {}
            } else {
                // نسخ للحافظة
                try {
                    await navigator.clipboard.writeText(shareText);
                    showToast('✅ تم نسخ رابط المشاركة!');
                } catch(e) {
                    showToast('📋 ' + shareUrl);
                }
            }
        }

        // toast بسيط
        function showToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;font-size:13px;z-index:9999;font-family:Tajawal,sans-serif;';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // فتح لعبة مباشرة من URL
        function checkUrlGame() {
            const params = new URLSearchParams(location.search);
            const gameId = parseInt(params.get('game'));
            if (gameId && games.length) {
                const game = games.find(g => g.id === gameId);
                if (game) playGame(game.embedUrl, game.name, game.id);
            }
        }

        // فلتر المفضلة
        function filterByFavorites(btn) {
            activeCategory = '❤️';
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('searchInput').value = '';
            const favGames = games.filter(g => favorites.includes(g.id));
            if (!favGames.length) {
                document.getElementById('gameGrid').innerHTML = '<div class="empty-state">💔 لم تضف أي لعبة للمفضلة بعد<br><small>اضغط ❤️ على أي لعبة لإضافتها</small></div>';
            } else {
                renderGames(favGames);
            }
        }

        // فلتر الجهاز
        function filterDevice(device, btn) {
            activeDevice = device;
            document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        // تطبيق كل الفلاتر
        function applyFilters() {
            let filtered = games;
            if (activeCategory !== 'الكل') filtered = filtered.filter(g => g.category === activeCategory);
            if (activeDevice === 'mobile') filtered = filtered.filter(g => g.device === 'all');
            if (activeDevice === 'desktop') filtered = filtered.filter(g => g.device === 'desktop' || g.device === 'all');
            const term = document.getElementById('searchInput').value.toLowerCase();
            if (term) filtered = filtered.filter(g => g.name.toLowerCase().includes(term));
            // مفضلة في القمة لو تصنيف الكل
            if (activeCategory === 'الكل' && !term) {
                const favGames = filtered.filter(g => favorites.includes(g.id));
                const rest = filtered.filter(g => !favorites.includes(g.id));
                filtered = [...favGames, ...rest];
            }
            renderGames(filtered);
        }

        // تبديل المفضلة
        function toggleFavorite(id, btn) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
                btn.textContent = '🤍';
                btn.classList.remove('active');
            } else {
                favorites.push(id);
                btn.textContent = '❤️';
                btn.classList.add('active');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            const favBtn2 = document.getElementById('favCatBtn');
            if (favBtn2) favBtn2.textContent = `❤️ المفضلة (${favorites.length})`;
        }

        // آخر الألعاب
        function addToRecently(game) {
            recentlyPlayed = recentlyPlayed.filter(r => r.id !== game.id);
            recentlyPlayed.unshift({id: game.id, name: game.name, icon: game.icon});
            if (recentlyPlayed.length > 10) recentlyPlayed.pop();
            localStorage.setItem('recentlyPlayed', JSON.stringify(recentlyPlayed));
            renderRecently();
        }

        function renderRecently() {
            if (!recentlyPlayed.length) return;
            document.getElementById('recentlySection').style.display = 'block';
            const scroll = document.getElementById('recentlyScroll');
            scroll.innerHTML = '';
            recentlyPlayed.forEach(r => {
                const item = document.createElement('div');
                item.className = 'recently-item';
                const img = document.createElement('img');
                img.src = r.icon;
                img.alt = r.name;
                const span = document.createElement('span');
                span.textContent = r.name;
                item.appendChild(img);
                item.appendChild(span);
                const game = games.find(g => g.id === r.id);
                if (game) item.addEventListener('click', () => playGame(game.embedUrl, game.name, game.id));
                scroll.appendChild(item);
            });
        }

        window.onload = async () => {
            await loadGames();
            renderRecently();
            checkUrlGame();
        };
    </script>

</body>
</html>
